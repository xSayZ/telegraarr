[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "telegraarr"
version = "0.1.0"
description = "A Telegram bot for your *arr stack — query requests, downloads, and library availability"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[project.urls]
Homepage = "https://github.com/<your-username>/telegraarr"
Issues = "https://github.com/<your-username>/telegraarr/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]